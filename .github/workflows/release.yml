name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio Installer vswhere.exe was not found on the runner.'
          }

          $msbuildPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuildPath) {
            throw 'MSBuild was not found on the runner.'
          }

          $appName = [string][char]0x7A97 + [string][char]0x683C
          $solutionPath = Join-Path $env:GITHUB_WORKSPACE "$appName.sln"
          if (-not (Test-Path $solutionPath)) {
            throw "Solution file was not found: $solutionPath"
          }

          & $msbuildPath $solutionPath /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $appName = [string][char]0x7A97 + [string][char]0x683C
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "$appName\bin\Release"
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $packageDirectory = Join-Path $env:RUNNER_TEMP "$appName-release-package"
          $installerPath = Join-Path $env:RUNNER_TEMP 'ndp48-web.exe'
          $version = $env:GITHUB_REF_NAME

          $executable = Join-Path $outputDirectory "$appName.exe"
          if (-not (Test-Path $executable)) {
            throw "Expected executable was not produced: $executable"
          }

          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?LinkId=2085155' `
            -OutFile $installerPath -UseBasicParsing
          $installerSignature = Get-AuthenticodeSignature -FilePath $installerPath
          if ($installerSignature.Status -ne 'Valid' -or
              $installerSignature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'The downloaded .NET Framework installer does not have a valid Microsoft signature.'
          }

          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item $executable (Join-Path $releaseDirectory "$appName-$version.exe")
          Copy-Item $executable, $installerPath -Destination $packageDirectory

          Compress-Archive -Path (Join-Path $packageDirectory '*') `
            -DestinationPath (Join-Path $releaseDirectory "$appName-$version-windows-x64.zip") `
            -CompressionLevel Optimal

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
