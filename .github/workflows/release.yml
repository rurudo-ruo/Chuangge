name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio Installer vswhere.exe was not found on the runner.'
          }

          $msbuildPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuildPath) {
            throw 'MSBuild was not found on the runner.'
          }

          & $msbuildPath .\窗格.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Prepare release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE '窗格\bin\Release'
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $packageDirectory = Join-Path $env:RUNNER_TEMP '窗格-release-package'
          $version = $env:GITHUB_REF_NAME

          $executable = Join-Path $outputDirectory '窗格.exe'
          $configuration = Join-Path $outputDirectory '窗格.exe.config'
          if (-not (Test-Path $executable)) {
            throw "Expected executable was not produced: $executable"
          }
          if (-not (Test-Path $configuration)) {
            throw "Expected application configuration was not produced: $configuration"
          }
          foreach ($culture in @('cs', 'zh-CN')) {
            if (-not (Test-Path (Join-Path $outputDirectory "$culture\窗格.resources.dll"))) {
              throw "Expected $culture resource assembly was not produced."
            }
          }

          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item $executable (Join-Path $releaseDirectory "窗格-$version.exe")
          Copy-Item $executable, $configuration -Destination $packageDirectory
          Copy-Item (Join-Path $outputDirectory 'cs') -Destination $packageDirectory -Recurse
          Copy-Item (Join-Path $outputDirectory 'zh-CN') -Destination $packageDirectory -Recurse
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md'), (Join-Path $env:GITHUB_WORKSPACE 'LICENSE'), (Join-Path $env:GITHUB_WORKSPACE 'screenshot.png') -Destination $packageDirectory

          Compress-Archive -Path (Join-Path $packageDirectory '*') `
            -DestinationPath (Join-Path $releaseDirectory "窗格-$version-windows-x64.zip") `
            -CompressionLevel Optimal

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
